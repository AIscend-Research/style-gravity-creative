[project]
name = "style-gravity-text"
version = "0.1.0"
description = "Measuring authorial reach: how many lines a human-authored poem opening survives before a model's house style reclaims it."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.scripts]
stylegravity = "stylegravity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stylegravity"]
